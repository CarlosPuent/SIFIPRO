spring.application.name=sifipro-platform-api
server.port=8082

# Shares the same PostgreSQL database as sifipro-backend. Same env var names as
# sifipro-backend for consistency (SPRING_DATASOURCE_URL is Spring Boot's standard
# relaxed-binding property name, so it overrides spring.datasource.url automatically
# when set as an environment variable, e.g. in docker-compose).
spring.datasource.url=jdbc:postgresql://localhost:5432/sifipro_db
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

# This service does NOT own the shared schema. sifipro-backend is the only owner of
# migrations (Flyway). Never let Hibernate touch the schema here.
spring.jpa.hibernate.ddl-auto=none
spring.flyway.enabled=false

management.endpoints.web.exposure.include=health,info
