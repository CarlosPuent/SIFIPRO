version: '3.8'

# ─────────────────────────────────────────────────────────────────────────────
#  SIFIPRO – Sistema de Fidelización Profesional
#  Uso: docker compose up --build
#  Acceso: http://localhost:5173
# ─────────────────────────────────────────────────────────────────────────────

services:

  # ── PostgreSQL ──────────────────────────────────────────────────────────────
  db:
    image: postgres:16-alpine
    container_name: sifipro-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: sifipro_db
      POSTGRES_USER: ${DB_USERNAME}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U sifipro -d sifipro_db"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s
    networks:
      - sifipro-net

  # ── Spring Boot Backend ──────────────────────────────────────────────────────
  backend:
    build:
      context: ./sifipro-backend
      dockerfile: Dockerfile
    container_name: sifipro-backend
    restart: unless-stopped
    ports:
      - "8085:8081"   # expuesto solo para debug/Swagger, no lo usa el frontend
    environment:
      SPRING_PROFILES_ACTIVE: dev
      SPRING_DATASOURCE_URL: jdbc:postgresql://db:5432/sifipro_db
      DB_USERNAME: ${DB_USERNAME}
      DB_PASSWORD: ${DB_PASSWORD}
      APP_JWT_SECRET: ${APP_JWT_SECRET}
    depends_on:
      db:
        condition: service_healthy
    networks:
      - sifipro-net

  # ── Spring Boot Platform API ──────────────────────────────────────────────────
  platform-api:
    build:
      context: ./sifipro-platform-api
      dockerfile: Dockerfile
    container_name: sifipro-platform-api
    restart: unless-stopped
    ports:
      - "8086:8082"   # expuesto solo para debug, no lo usa platform-ui
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://db:5432/sifipro_db
      DB_USERNAME: ${DB_USERNAME}
      DB_PASSWORD: ${DB_PASSWORD}
      # Deliberadamente distinto de APP_JWT_SECRET: un token de plataforma nunca
      # debe ser válido en tenant-api, ni viceversa.
      PLATFORM_JWT_SECRET: ${PLATFORM_JWT_SECRET}
    depends_on:
      db:
        condition: service_healthy
    networks:
      - sifipro-net

  # ── React + nginx Frontend ───────────────────────────────────────────────────
  frontend:
    build:
      context: ./sifipro-frontend
      dockerfile: Dockerfile
      args:
        # String vacío: el frontend hace requests relativos (/api/...)
        # nginx los intercepta y los proxea internamente al container backend.
        # Mismo comportamiento que el proxy de Vite en desarrollo.
        VITE_API_URL: ""
    container_name: sifipro-frontend
    restart: unless-stopped
    ports:
      - "5173:80"
    depends_on:
      - backend
    networks:
      - sifipro-net

  # ── React + nginx Platform UI ─────────────────────────────────────────────────
  platform-ui:
    build:
      context: ./sifipro-platform-ui
      dockerfile: Dockerfile
      args:
        # String vacío: platform-ui hace requests relativos (/api/...)
        # nginx los intercepta y los proxea internamente al container platform-api.
        VITE_API_BASE_URL: ""
    container_name: sifipro-platform-ui
    restart: unless-stopped
    ports:
      - "5174:80"
    depends_on:
      - platform-api
    networks:
      - sifipro-net

volumes:
  pgdata:
    name: sifipro-pgdata

networks:
  sifipro-net:
    driver: bridge
